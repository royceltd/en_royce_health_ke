# Every push to version-16 (and every pull request): a fresh Frappe bench with
# the hospital's apps at their released versions, a new site, the demo hospital,
# and all royce_health_ke tests. Red = don't release.
#
# The app versions come from the hospital release file, deploy/apps.health.json
# (the same pins the image is built from). Marley's version is also checked by
# test_marley (royce_health_ke/marley.py SUPPORTED).
# Secret ROYCE_APPS_TOKEN: fine-grained token, Contents read-only on the
# royceltd app repos (the private apps are cloned with it).
name: Tests

on:
  push:
    branches: [version-16]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -proot" --health-interval=5s
          --health-timeout=2s --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - name: Versions from the release file
        run: |
          set -euo pipefail
          ref() { jq -r --arg r "$1" '.[] | select(.url | endswith("/" + $r)) | .branch' deploy/apps.health.json; }
          {
            echo "FRAPPE_REF=$(sed -n 's/^FRAPPE_BRANCH=//p' deploy/hospital.env.example)"
            echo "ERPNEXT_REF=$(ref erpnext)"
            echo "HRMS_REF=$(ref hrms)"
            echo "MARLEY_REF=$(ref marley)"
            echo "KENYAN_ACCOUNTANT_REF=$(ref en_kenyan_accountant)"
            echo "ROYCE_PAYROLL_KE_REF=$(ref en_royce_payroll_ke)"
            echo "ROYCE_TALK_REF=$(ref en_royce_talk)"
            echo "ROYCE_PAYMENTS_REF=$(ref en_royce_payments)"
            echo "ROYCE_ETIMS_REF=$(ref en_royce_etims)"
          } | tee -a "$GITHUB_ENV"
          grep -q '=$' "$GITHUB_ENV" && { echo "a version is missing from deploy/apps.health.json" >&2; exit 1; } || true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('deploy/apps.health.json') }}
          restore-keys: pip-${{ runner.os }}-

      - name: MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - name: Bench
        run: |
          pip install -q frappe-bench
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch "$FRAPPE_REF" --python "$(which python)" ~/frappe-bench

      - name: Apps (released versions)
        working-directory: /home/runner/frappe-bench
        env:
          TOKEN: ${{ secrets.ROYCE_APPS_TOKEN }}
        run: |
          get() { bench get-app --skip-assets --branch "$2" "$1" >/dev/null && echo "got $1 @ $2"; }
          private() { echo "https://x-access-token:${TOKEN}@github.com/royceltd/$1"; }
          get https://github.com/frappe/erpnext "$ERPNEXT_REF"
          get https://github.com/frappe/hrms "$HRMS_REF"
          get https://github.com/earthians/marley "$MARLEY_REF"
          get "$(private en_kenyan_accountant)" "$KENYAN_ACCOUNTANT_REF"
          get "$(private en_royce_payroll_ke)" "$ROYCE_PAYROLL_KE_REF"
          get "$(private en_royce_talk)" "$ROYCE_TALK_REF"
          get "$(private en_royce_payments)" "$ROYCE_PAYMENTS_REF"
          get "$(private en_royce_etims)" "$ROYCE_ETIMS_REF"
          bench get-app --skip-assets royce_health_ke "$GITHUB_WORKSPACE" >/dev/null && echo "got royce_health_ke @ ${GITHUB_SHA::8}"
          bench setup requirements --dev >/dev/null

      - name: Site with every hospital app
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench new-site --db-root-password root --admin-password admin test_site >/dev/null
          for app in erpnext hrms healthcare kenyan_accountant royce_payroll_ke royce_talk royce_payments royce_etims royce_health_ke; do
            bench --site test_site install-app "$app" >/dev/null && echo "installed $app"
          done

      - name: Demo hospital
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config royce_health_demo 1
          bench --site test_site set-config allow_tests true
          bench --site test_site execute royce_health_ke.demo.load >/dev/null

      # Print tests render through Frappe's printview, which needs the built
      # asset list (print.bundle.css); only Frappe's own bundles are used.
      - name: Assets for printing
        working-directory: /home/runner/frappe-bench
        run: bench build --app frappe >/dev/null

      - name: Tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app royce_health_ke
