# Builds the hospital image (RoyceERP Health) from the pinned hospital release
# manifest, on GitHub's machines, and stores it in the private registry:
#   ghcr.io/royceltd/royceerp-health:<tag>
# Servers pull it (deploy/deploy-release.sh); nothing is built
# on a live server any more.
#
# Run: Actions > Hospital image > Run workflow, tag e.g. 16-hke0.37.1 (the same
# tag the server's compose file uses). The manifest must already name the
# release's app versions (apps.health.json, tags only).
# Secret ROYCE_APPS_TOKEN: fine-grained token, Contents read-only on the
# royceltd app repos.
name: Hospital image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 16-hke0.37.1"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Room for a 6 GB image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Pinned inputs
        id: pins
        run: |
          set -euo pipefail
          env_file=deploy/hospital.env.example
          echo "frappe_docker=$(sed -n 's/^FRAPPE_DOCKER_COMMIT=//p' $env_file)" >> "$GITHUB_OUTPUT"
          echo "frappe=$(sed -n 's/^FRAPPE_BRANCH=//p' $env_file)" >> "$GITHUB_OUTPUT"
          # refs must be tags, never branches (ADR-019)
          if grep -q '"branch": "version-' deploy/apps.health.json; then
            echo "apps.health.json names a branch: pin every app to a tag" >&2; exit 1
          fi
          grep -o '"branch": "[^"]*"' deploy/apps.health.json

      - name: frappe_docker at the pinned commit
        run: |
          git clone -q https://github.com/frappe/frappe_docker.git /tmp/frappe_docker
          git -C /tmp/frappe_docker -c advice.detachedHead=false checkout -q "${{ steps.pins.outputs.frappe_docker }}"

      - name: Apps list with the read token
        env:
          TOKEN: ${{ secrets.ROYCE_APPS_TOKEN }}
        run: |
          umask 077
          sed "s#https://TOKEN@#https://x-access-token:${TOKEN}@#" deploy/apps.health.json > /tmp/apps.json

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        working-directory: /tmp/frappe_docker
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/royceerp-health:${{ inputs.tag }}"
          docker buildx build \
            --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg=FRAPPE_BRANCH="${{ steps.pins.outputs.frappe }}" \
            --build-arg=CACHE_BUST="$(date +%s)" \
            --secret=id=apps_json,src=/tmp/apps.json \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE" --push \
            --file=images/layered/Containerfile .
          rm -f /tmp/apps.json
          echo "pushed $IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
